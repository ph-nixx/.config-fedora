; Bar styled like the LightDM login panel (GTK Adwaita "osd")
[colors]
background = #353535
foreground = #eeeeec
dim        = #919190
urgent     = #e01b24
mode       = #f6d32d
accent     = #3584e4

[bar/omarchy]
width = 100%
height = 28
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrains Mono:size=12;2
font-1 = Symbols Nerd Font Mono:size=12;2
modules-left = logo i3
modules-center = date
modules-right = tray eth pulseaudio cpu battery
wm-restack = i3
cursor-click = pointer

[module/logo]
type = custom/text
format = 

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>
label-focused = %index%
label-focused-foreground = ${colors.foreground}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.dim}
label-visible = %index%
label-visible-padding = 1
label-urgent = %index%
label-urgent-padding = 1
label-urgent-foreground = ${colors.urgent}
label-mode = %mode%
label-mode-foreground = ${colors.mode}

[module/date]
type = internal/date
interval = 1
date = %A %H:%M
date-alt = %d %B W%V %Y
label = %date%

[module/tray]
type = internal/tray
tray-spacing = 6px

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{A1:kitty -e nmtui &:}<ramp-signal>%{A}
format-disconnected = %{A1:kitty -e nmtui &:}󰤮%{A}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

[module/eth]
type = internal/network
interface-type = wired
interval = 3
format-connected = 󰀂
format-disconnected =

[module/pulseaudio]
type = internal/pulseaudio
; left-click is hard-wired to mute, so wrap the icon in our own click action
format-volume = %{A1:pavucontrol &:}<ramp-volume>%{A}
format-muted = %{A1:pavucontrol &:}<label-muted>%{A}
label-muted = 󰝟
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/cpu]
type = internal/cpu
interval = 5
label = %{A1:kitty -e top &:}󰍛%{A}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 99
format-charging = <label-charging>
label-charging = 󰂄
format-discharging = <ramp-capacity>
label-full = 󰂅
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹

[settings]
screenchange-reload = true
